<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 포털 로그인 세션 자동 첨부(history26 v83) -->
<script src="https://hyonnie-t.github.io/history26/snippets/portal_auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능 던전 — 3학년 한국사</title>
<link rel="stylesheet" href="style.css?v=20261103v2">
</head>
<body>
<div id="previewBar" class="preview-bar" hidden>미리보기 모드 — 저장되지 않아. 열쇠 글자 없이도 넘어갈 수 있어</div>

<!-- ───────── 입구 ───────── -->
<section id="s0" class="page">
  <header class="gate-head">
    <p class="eyebrow">3학년 한국사 · 조선 후기 → 현대</p>
    <h1 class="title">수능 던전</h1>
    <p class="lead">선생님이 칠판에서 문제를 함께 풀며 길을 열어 줘. 너는 네 태블릿으로 매 문제 직접 답하고, 맞힐 때마다 반 전체가 보스를 깎아.</p>
  </header>

  <div class="card">
    <h2 class="h2">① 누구?</h2>
    <div class="row2">
      <label class="field"><span>학번</span><input id="sid" type="text" inputmode="numeric" maxlength="5" placeholder="5자리 숫자"></label>
      <label class="field"><span>이름</span><input id="sname" type="text" maxlength="12" placeholder="이름"></label>
    </div>
  </div>

  <div class="card" id="sessionCard">
    <h2 class="h2">② 오늘 던전</h2>
    <div id="sessionPick" class="pick-grid"></div>
    <details class="more"><summary>층 하나씩 하는 차시·모의고사 20문항</summary><div id="sessionPickSplit" class="pick-grid"></div></details>
  </div>

  <p id="startErr" class="err" role="alert"></p>
  <button id="startBtn" class="btn-main" type="button">던전 입장</button>
</section>

<!-- ───────── 기숙사(성향 테스트) ───────── -->
<section id="sHouse" class="page" hidden>
  <div id="houseView"></div>
</section>

<!-- ───────── 수업(개인 태블릿) ───────── -->
<section id="sPlay" class="page" hidden>
  <div class="hud" id="hud">
    <div class="hud-top">
      <span class="hud-floor" id="hudFloor"></span>
      <span class="hud-turn" id="hudStep"></span>
      <span class="hud-house" id="hudHouse"></span>
    </div>
    <div class="hud-stats"><span>내 점수 <b id="hudPts">0</b></span><span>보스에게 준 피해 <b id="hudDmg">0</b></span><span>도감 <b id="hudCards">0</b>장</span></div>
  </div>
  <div id="playView"></div>
</section>

<!-- ───────── 통합 모의고사 ───────── -->
<section id="sMock" class="page" hidden>
  <div class="hud" id="mockHud">
    <div class="hud-top">
      <span class="hud-floor">통합 모의고사 · 개인전</span>
      <span class="hud-turn" id="mockProg"></span>
      <span class="hud-time" id="mockTime">20:00</span>
    </div>
  </div>
  <div id="mockView"></div>
</section>

<!-- ───────── 결과·제출 ───────── -->
<section id="sEnd" class="page" hidden>
  <div id="endView"></div>
</section>

<!-- ───────── 교사 화면 (?teacher=1) ───────── -->
<section id="sTeacher" class="page wide" hidden>
  <header class="gate-head">
    <p class="eyebrow">교사 화면</p>
    <h1 class="title">수능 던전 · 수업 진행</h1>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="live" role="tab">수업 진행</button>
    <button class="tab" data-tab="houses" role="tab">기숙사 배정</button>
    <button class="tab" data-tab="points" role="tab">기숙사 포인트</button>
    <button class="tab" data-tab="bank" role="tab">문제 은행</button>
  </nav>
  <div id="tLive" class="tab-pane"></div>
  <div id="tHouses" class="tab-pane" hidden></div>
  <div id="tPoints" class="tab-pane" hidden></div>
  <div id="tBank" class="tab-pane" hidden></div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="snippets/focus_guard.js?v=20261103v2"></script>
<script src="snippets/draft_guard.js?v=20261103v2"></script>
<script src="snippets/glossary.js?v=20261103v2"></script>
<script src="data.js?v=20261103v2"></script>
<script src="questions.js?v=20261103v2"></script>
<script src="plan.js?v=20261103v2"></script>
<script src="logic.js?v=20261103v2"></script>
<script src="app.js?v=20261103v2"></script>
</body>
</html>
